# Lingkungan development lokal: PostgreSQL 16 + aplikasi.
# Variabel dibaca otomatis dari file .env di folder yang sama.
#
# Hanya database (aplikasi dijalankan dari IDE/Gradle):
#   docker compose -f compose.local.yml up -d postgres
#
# Database + aplikasi (image aplikasi di-build dari Dockerfile):
#   docker compose -f compose.local.yml up -d --build
#
# Healthcheck aplikasi:
#   curl http://localhost:8080/actuator/health
#
# Menghentikan (tambahkan -v untuk menghapus data PostgreSQL lokal):
#   docker compose -f compose.local.yml down
name: afl3-local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB belum di-set di .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER belum di-set di .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum di-set di .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: afl3:local
    environment:
      DB_RW_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_RW_USERNAME: ${POSTGRES_USER}
      DB_RW_PASSWORD: ${POSTGRES_PASSWORD}
      # Lokal hanya ada satu instance PostgreSQL; pool RO diarahkan ke instance yang sama.
      DB_RO_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_RO_USERNAME: ${POSTGRES_USER}
      DB_RO_PASSWORD: ${POSTGRES_PASSWORD}
      # Khusus lokal: tampilkan detail komponen health (db, diskSpace, dst.).
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
