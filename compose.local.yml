# Lingkungan development lokal: PostgreSQL 16 + aplikasi.
# Default lokal tersedia tanpa .env; file .env opsional untuk override.
#
# Hanya database (aplikasi dijalankan dari IDE/Gradle):
#   docker compose -f compose.local.yml up -d postgres
#
# Database + aplikasi (image aplikasi di-build dari Dockerfile):
#   docker compose -f compose.local.yml up -d --build
#
# Healthcheck aplikasi dan endpoint uji coba:
#   curl http://localhost:8080/actuator/health
#   curl http://localhost:8080/system/status
#
# Menghentikan (tambahkan -v untuk menghapus data PostgreSQL lokal):
#   docker compose -f compose.local.yml down
name: afl3-local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-miniapp_db}
      POSTGRES_USER: ${POSTGRES_USER:-miniapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miniapp_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: afl3:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-miniapp_db}
      DB_USERNAME: ${POSTGRES_USER:-miniapp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-miniapp_local}
      # Khusus lokal: tampilkan detail komponen health (db, diskSpace, dst.).
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
