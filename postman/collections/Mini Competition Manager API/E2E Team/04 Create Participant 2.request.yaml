$kind: http-request
url: '{{host}}/api/competitions/{{competitionId}}/participants'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "E2E Team 2",
      "members": [{ "name": "Team 2 Member A" }, { "name": "Team 2 Member B" }]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('participant 2 is created', function () {
        pm.response.to.have.status(201);
        pm.collectionVariables.set('participant2Id', pm.response.json().id);
      });
    language: text/javascript
order: 4000
