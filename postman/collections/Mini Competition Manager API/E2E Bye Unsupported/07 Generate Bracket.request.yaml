$kind: http-request
url: '{{host}}/api/competitions/{{competitionId}}/matches'
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('participant count requiring byes is rejected', function () {
        pm.response.to.have.status(409);
        const response = pm.response.json();
        pm.expect(response.code).to.eql('INVALID_PARTICIPANT_COUNT');
        pm.expect(response.message).to.be.a('string').and.not.empty;
      });
    language: text/javascript
order: 7000
