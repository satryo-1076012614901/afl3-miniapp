spring:
  application:
    name: afl3
  config:
    # Saat dijalankan dari IDE/Gradle, variabel dibaca dari file .env di root project (jika ada).
    # Environment variable yang di-set langsung (container/CI) tetap lebih diprioritaskan.
    import: optional:file:.env[.properties]
  web:
    resources:
      cache:
        cachecontrol:
          # UI playground selalu mengambil HTML/CSS/JS terbaru setelah aplikasi diperbarui.
          no-store: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      schema: ${DB_SCHEMA:public}
      pool-name: afl3
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    # Mencegah koneksi tertahan sepanjang request; akses lazy relation harus selesai di service.
    open-in-view: false
    hibernate:
      # Schema dikelola Flyway; Hibernate hanya memvalidasi kesesuaian entity dengan schema.
      ddl-auto: validate
    properties:
      hibernate:
        # Entity dipetakan ke schema milik environment (production/develop/public).
        default_schema: ${DB_SCHEMA:public}
  flyway:
    locations: classpath:db/migration
    # Setiap environment memakai schema sendiri di database yang sama.
    # Server: schema dibuat admin DB dan dimiliki role environment (lihat HELP.md).
    # Lokal: schema dibuat otomatis oleh Flyway bila belum ada.
    schemas: ${DB_SCHEMA:public}
    default-schema: ${DB_SCHEMA:public}
    create-schemas: true

app:
  # Nama environment yang sedang berjalan (local/develop/production); ditampilkan di /system/status.
  environment: ${APP_ENV:local}

server:
  port: ${SERVER_PORT:8080}
  # Memproses header X-Forwarded-* dari Traefik, termasuk X-Forwarded-Prefix (/production, /develop)
  # yang dikirim middleware StripPrefix, sehingga URL yang dibentuk aplikasi tetap menyertakan prefix.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
